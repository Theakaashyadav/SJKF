services:
  - type: web
    name: sjkf
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.x"
      - key: NEXT_PUBLIC_RAZORPAY_API_URL
        fromService:
          type: web
          name: sjkf-payments
          envVarKey: PAYMENT_PUBLIC_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups

  - type: web
    name: sjkf-payments
    runtime: node
    plan: free
    branch: main
    rootDir: payment-api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.x"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_ALLOWED_ORIGINS
        value: https://www.swabhimankalyanfoundation.org,https://swabhimankalyanfoundation.org,https://sjkf.onrender.com
      - key: PAYMENT_PUBLIC_URL
        fromService:
          type: web
          name: sjkf-payments
          envVarKey: RENDER_EXTERNAL_URL
